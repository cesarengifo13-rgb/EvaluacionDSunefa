<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Conexión Firebase - UNEFA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getFirestore, doc, setDoc, onSnapshot } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyCQzRYL2PhgAFtcZlgsX69ooVmcuP-7bqM",
            authDomain: "evaluaciondsunefa.firebaseapp.com",
            projectId: "evaluaciondsunefa",
            storageBucket: "evaluaciondsunefa.firebasestorage.app",
            messagingSenderId: "901181829694",
            appId: "1:901181829694:web:3eea56237de2dc81c2d76f",
            measurementId: "G-ZPMJF8NVQ4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const statusDiv = document.getElementById('connection-status');
        statusDiv.textContent = "Conectado a Firebase correctamente. Listo para probar.";
        statusDiv.className = "p-3 bg-emerald-100 text-emerald-800 rounded-lg text-xs font-semibold";

        // Referencia a un documento de prueba fijo
        const testDocRef = doc(db, "test_conexion", "prueba_grupo");

        // 1. Escuchar cambios en tiempo real desde Firestore
        onSnapshot(testDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('display-message').textContent = data.mensaje || "Sin mensaje";
                document.getElementById('display-time').textContent = data.hora || "--:--:--";
            } else {
                document.getElementById('display-message').textContent = "Aún no hay datos creados.";
            }
        });

        // 2. Botón para actualizar el dato en la nube
        window.enviarPrueba = async function() {
            const textoInput = document.getElementById('input-mensaje').value;
            const horaActual = new Date().toLocaleTimeString();

            try {
                await setDoc(testDocRef, {
                    mensaje: textoInput,
                    hora: horaActual
                });
                alert("¡Dato enviado a Firebase con éxito!");
            } catch (e) {
                console.error("Error al escribir en Firebase:", e);
                alert("Error al escribir: " + e.message);
            }
        };
    </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white border border-slate-200 rounded-2xl p-6 shadow-xl space-y-6">
        <div class="text-center">
            <h1 class="text-xl font-bold text-blue-900">Prueba de Conexión en Vivo</h1>
            <p class="text-xs text-slate-500 mt-1">Diagnóstico de Firebase para GitHub Pages</p>
        </div>

        <div id="connection-status" class="p-3 bg-amber-100 text-amber-800 rounded-lg text-xs font-semibold text-center">
            Conectando con Firebase...
        </div>

        <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl space-y-3">
            <h2 class="text-xs font-bold text-slate-700 uppercase">Estado recibido desde la nube:</h2>
            <p class="text-sm font-bold text-blue-600" id="display-message">Esperando datos...</p>
            <p class="text-xs text-slate-400">Última actualización: <span id="display-time">--:--:--</span></p>
        </div>

        <div class="space-y-3">
            <label class="block text-xs font-medium text-slate-700">Escribe algo para probar la sincronización:</label>
            <input type="text" id="input-mensaje" placeholder="Ej. ¡Hola desde el teléfono 1!" class="w-full bg-slate-50 border border-slate-300 rounded px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="enviarPrueba()" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">
                Enviar y Sincronizar en la Nube
            </button>
        </div>
    </div>
</body>
</html>
