    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQzRYL2PhgAFtcZlgsX69ooVmcuP-7bqM",
            authDomain: "evaluaciondsunefa.firebaseapp.com",
            projectId: "evaluaciondsunefa",
            storageBucket: "evaluaciondsunefa.firebasestorage.app",
            messagingSenderId: "901181829694",
            appId: "1:901181829694:web:3eea56237de2dc81c2d76f",
            measurementId: "G-ZPMJF8NVQ4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const statusDiv = document.getElementById('connection-status');
        statusDiv.textContent = "¡Conectado a Firebase correctamente!";
        statusDiv.className = "p-3 bg-emerald-100 text-emerald-800 rounded-lg text-xs font-semibold text-center";

        const testDocRef = doc(db, "test_conexion", "prueba_grupo");

        onSnapshot(testDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('display-message').textContent = data.mensaje || "Sin mensaje";
                document.getElementById('display-time').textContent = data.hora || "--:--:--";
            } else {
                document.getElementById('display-message').textContent = "Aún no hay datos creados.";
            }
        });

        window.enviarPrueba = async function() {
            const textoInput = document.getElementById('input-mensaje').value;
            const horaActual = new Date().toLocaleTimeString();

            try {
                await setDoc(testDocRef, {
                    mensaje: textoInput,
                    hora: horaActual
                });
                alert("¡Dato enviado a Firebase con éxito!");
            } catch (e) {
                console.error("Error al escribir en Firebase:", e);
                alert("Error al escribir: " + e.message);
            }
        };
    </script>
